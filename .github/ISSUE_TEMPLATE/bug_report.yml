name: Bug report
description: Something does not work, sounds wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Error text if any.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `medit doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: medit version
      placeholder: "medit --version"
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web UI, Built-in assistant, MCP agent (Claude Code, Cursor, ...), CLI]
  - type: textarea
    id: song
    attributes:
      label: Song file (optional)
      description: Attach the song .json if the problem is in the render or the mix.
